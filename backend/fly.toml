# Fly.io config for the Clipso license server.
# Rename `app` if the name is taken, then: fly launch --no-deploy  (first time)
# or  fly deploy  (subsequent).

app = "clipso-license-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Runs on every deploy, before the new version takes traffic. schema.sql is
# idempotent so this is safe to repeat.
[deploy]
  release_command = "npm run migrate"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
