name: Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    name: Migrate + Jest (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        postgres: ['16']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clipso_licenses
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/clipso_licenses
      DATABASE_SSL: disable
      RUN_DB_TESTS: '1'
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (production deps, high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Run schema migration
        run: npm run migrate

      - name: Run schema migration again (idempotency)
        run: npm run migrate

      - name: Jest
        run: npm test
